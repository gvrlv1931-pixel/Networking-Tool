<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Network</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="logo-wrap">
      <div class="logo">Network</div>
      <div class="logo-sub">Your global network</div>
    </div>
    <div class="header-actions">
      <button class="color-guide-btn" id="colorGuideBtn">Color Guide</button>
      <div class="view-toggle">
        <button class="view-btn active" data-view="cards">Cards</button>
        <button class="view-btn" data-view="overview">Overview</button>
        <button class="view-btn" data-view="map">Map</button>
        <button class="view-btn" data-view="calendar">Cal</button>
      </div>
      <span class="count-badge" id="countBadge">0</span>
    </div>
  </div>
  <div id="headerSearch">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="search"
        placeholder="Search name, codeword, expertise, action..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="search-clear" id="searchClear" title="Clear">x</button>
    </div>
    <div class="filters-row">
      <div class="filters-wrap" id="filtersWrap">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="professional">Pro</button>
        <button class="filter-chip" data-filter="personal">Personal</button>
        <button class="filter-chip" data-filter="both">Both</button>
        <button class="filter-chip" data-filter="action">Has Action</button>
        <button class="filter-chip" data-filter="recent">Recent</button>
      </div>
      <div class="sort-dropdown-wrap">
        <button class="sort-dropdown-btn" id="sortDropdownBtn">
          <span class="sort-dropdown-label">A–Z</span>
          <span>▾</span>
        </button>
        <div class="sort-dropdown" id="sortDropdown">
          <button class="sort-option active" data-sort="name">A–Z</button>
          <button class="sort-option" data-sort="name-desc">Z–A</button>
          <button class="sort-option" data-sort="recent">Last spoken</button>
          <button class="sort-option" data-sort="action">Action due</button>
          <button class="sort-option" data-sort="added">Date added</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Cards view -->
<div class="grid" id="grid"></div>

<!-- Overview view -->
<div id="overviewContainer" style="display:none"></div>

<!-- Map view -->
<div class="map-container" id="mapContainer" style="display:none"></div>

<!-- Calendar view -->
<div id="calendarContainer" style="display:none"></div>

<!-- Tooltip for map -->
<div class="map-tooltip" id="mapTooltip"></div>

<!-- FAB -->
<button class="fab" id="fabBtn" title="New contact (Ctrl+N)">+</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Bottom Nav (mobile) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-view="cards">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="9" height="9"/><rect x="13" y="3" width="9" height="9"/>
      <rect x="2" y="14" width="9" height="9"/><rect x="13" y="14" width="9" height="9"/>
    </svg>
    Cards
  </button>
  <button class="nav-item" data-view="overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    Overview
  </button>
  <button class="nav-item" data-view="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
    </svg>
    Map
  </button>
  <button class="nav-item" data-view="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Cal
  </button>
</nav>

<!-- ══ EDIT MODAL ══ -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">New Contact</div>
      <button class="modal-close" id="editClose">x</button>
    </div>
    <div class="modal-body">

      <details class="form-section" open>
        <summary>Identity</summary>
        <div class="form-section-content">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input class="form-input" id="f-name" type="text" placeholder="Jane Smith" maxlength="80" />
            </div>
            <div class="form-group">
              <label class="form-label">Codeword</label>
              <input class="form-input" id="f-codeword" type="text" placeholder="e.g. Startup Jane" maxlength="40" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Card Color</label>
            <div class="color-row" id="colorRow"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Network Type</label>
            <select class="form-select" id="f-networkType">
              <option value="">-- pick one --</option>
              <option value="professional">Professional</option>
              <option value="personal">Personal</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>
      </details>

      <details class="form-section" open>
        <summary>Background</summary>
        <div class="form-section-content">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Expertise / Role</label>
              <input class="form-input" id="f-expertise" type="text" placeholder="e.g. Product Design, Growth, DevRel" maxlength="100" />
            </div>
            <div class="form-group">
              <label class="form-label">Location</label>
              <input class="form-input" id="f-location" type="text" placeholder="e.g. London, UK" maxlength="80" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Context (how you met)</label>
            <textarea class="form-textarea short" id="f-context" placeholder="e.g. Met at ProductConf NYC 2024, sat next to each other at lunch..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Last Spoken</label>
              <input class="form-input" id="f-lastSpoken" type="date" />
            </div>
            <div class="form-group">
              <label class="form-label">Relationship Stage</label>
              <select class="form-select" id="f-stage">
                <option value="">-- pick one --</option>
                <option value="new">New connection</option>
                <option value="warm">Warming up</option>
                <option value="active">Actively in touch</option>
                <option value="dormant">Gone quiet</option>
                <option value="close">Close ally</option>
              </select>
            </div>
          </div>
        </div>
      </details>

      <details class="form-section" open>
        <summary>Conversation &amp; Meeting</summary>
        <div class="form-section-content">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Action Type</label>
              <select class="form-select" id="f-actionType">
                <option value="">-- none --</option>
                <option value="message">Send message</option>
                <option value="reply">Reply</option>
                <option value="follow-up">Follow up</option>
                <option value="intro">Make intro</option>
                <option value="call">Schedule call</option>
                <option value="meet">Meet in person</option>
                <option value="share">Share resource</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Action Due Date</label>
              <input class="form-input" id="f-actionDue" type="date" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">What to Do</label>
            <textarea class="form-textarea short" id="f-nextAction" placeholder="e.g. Send intro email connecting her with Jordan re: DevRel role"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Conv. Status</label>
              <select class="form-select" id="f-convStatus">
                <option value="">-- none --</option>
                <option value="follow-up">Need to follow up</option>
                <option value="waiting">Waiting for reply</option>
                <option value="arranging">Arranging meetup</option>
                <option value="active">Active back-and-forth</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Platform</label>
              <select class="form-select" id="f-convPlatform">
                <option value="">-- platform --</option>
                <option value="email">Email</option>
                <option value="linkedin">LinkedIn</option>
                <option value="whatsapp">WhatsApp</option>
                <option value="x">X / Twitter</option>
                <option value="phone">Phone</option>
                <option value="slack">Slack</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Conversation Topic</label>
            <textarea class="form-textarea short" id="f-convTopic" placeholder="e.g. Discussing API partnership, she said she'd send intro to their CTO"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Meeting Status</label>
              <select class="form-select" id="f-meetingStatus">
                <option value="">-- none --</option>
                <option value="potential">Potential</option>
                <option value="confirmed">Confirmed</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Meeting Date</label>
              <input class="form-input" id="f-meetingDate" type="date" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Meeting Time</label>
              <input class="form-input" id="f-meetingTime" type="time" />
            </div>
            <div class="form-group">
              <label class="form-label">Venue / Platform</label>
              <input class="form-input" id="f-meetingVenue" type="text" placeholder="e.g. Blue Bottle Coffee / Zoom" maxlength="80" />
            </div>
          </div>
        </div>
      </details>

      <details class="form-section">
        <summary>Their World</summary>
        <div class="form-section-content">
          <div class="form-group">
            <label class="form-label">Pain Points</label>
            <textarea class="form-textarea short" id="f-painPoints" placeholder="What keeps them up at night?"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Goals and Ambitions</label>
            <textarea class="form-textarea short" id="f-goals" placeholder="What are they working toward?"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">How They Can Help You</label>
            <textarea class="form-textarea short" id="f-howUseful" placeholder="e.g. Can intro me to climate VCs, has deep PLG expertise for Series A advice"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">How You Can Help Them</label>
            <textarea class="form-textarea short" id="f-howYouHelp" placeholder="e.g. Can connect them with hiring managers, share distribution for their launch"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">In Common (personal / both)</label>
            <textarea class="form-textarea short" id="f-inCommon" placeholder="e.g. Both love 90s hip-hop, same undergrad cohort, both have dogs named Biscuit"></textarea>
          </div>
        </div>
      </details>

      <details class="form-section">
        <summary>Fun &amp; Personal</summary>
        <div class="form-section-content">
          <div class="form-group">
            <label class="form-label">Fun Facts (one per line)</label>
            <textarea class="form-textarea" id="f-funFacts" placeholder="Loves surfing&#10;Has 3 rescue cats&#10;Went to Burning Man 5 times"></textarea>
          </div>
        </div>
      </details>

      <details class="form-section">
        <summary>Contact Details</summary>
        <div class="form-section-content">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" id="f-email" type="email" placeholder="jane@example.com" />
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input class="form-input" id="f-phone" type="tel" placeholder="+1 555 0100" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">LinkedIn</label>
              <input class="form-input" id="f-linkedin" type="text" placeholder="linkedin.com/in/..." />
            </div>
            <div class="form-group">
              <label class="form-label">X / Twitter</label>
              <input class="form-input" id="f-twitter" type="text" placeholder="@handle" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Instagram</label>
              <input class="form-input" id="f-instagram" type="text" placeholder="@handle" />
            </div>
            <div class="form-group">
              <label class="form-label">Website</label>
              <input class="form-input" id="f-website" type="text" placeholder="https://..." />
            </div>
          </div>
        </div>
      </details>

      <details class="form-section">
        <summary>Notes</summary>
        <div class="form-section-content">
          <div class="form-group">
            <textarea class="form-textarea short" id="f-notes" placeholder="Anything else worth remembering..."></textarea>
          </div>
        </div>
      </details>

    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" style="display:none">Del</button>
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ══ DETAIL MODAL ══ -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Contact</div>
      <button class="modal-close" id="detailClose">x</button>
    </div>
    <div id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="detailEditBtn">Edit</button>
    </div>
  </div>
</div>

<!-- ══ CONFIRM ══ -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete?</h3>
    <p id="confirmText">This will permanently remove this contact.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel">Keep</button>
      <button class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<!-- ══ COLOR GUIDE MODAL ══ -->
<div class="modal-overlay" id="colorGuideOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Color Guide</div>
      <button class="modal-close" id="colorGuideClose">x</button>
    </div>
    <div class="color-guide-body" id="colorGuideBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="colorGuideSave" onclick="closeColorGuide()">Save &amp; Close</button>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/storage.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
