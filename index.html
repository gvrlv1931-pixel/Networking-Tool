<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Network</title>
<style>
  :root {
    --bg: #f0ebe0;
    --card: #ffffff;
    --ink: #111111;
    --ink2: #444444;
    --ink3: #888888;
    --faint: #ddd8cc;
    --red: #c1121f;
    --mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 2px solid var(--ink);
    padding: 12px 14px 0;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
    line-height: 1;
    flex: 1;
  }

  .count-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink3);
  }

  /* ── Search ── */
  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .search-input {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 40px 9px 10px;
    outline: none;
    border-radius: 0;
    -webkit-appearance: none;
  }

  .search-input:focus { background: #fffef9; }
  .search-input::placeholder { color: var(--ink3); font-style: italic; }

  .search-clear {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 38px;
    background: none;
    border: none;
    border-left: 2px solid var(--ink);
    cursor: pointer;
    font-size: 11px;
    font-weight: 900;
    font-family: var(--mono);
    color: var(--ink3);
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }

  .search-clear.visible { display: flex; }
  .search-clear:hover { background: var(--ink); color: var(--card); }

  /* ── Filters ── */
  .filters-wrap {
    overflow-x: auto;
    scrollbar-width: none;
    display: flex;
    gap: 0;
    white-space: nowrap;
  }

  .filters-wrap::-webkit-scrollbar { display: none; }

  .filter-chip {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--ink3);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
    padding: 8px 12px 6px;
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: color 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .filter-chip:first-child { padding-left: 0; }
  .filter-chip:hover { color: var(--ink); }
  .filter-chip.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* ── Sort bar ── */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--faint);
  }

  .sort-bar::-webkit-scrollbar { display: none; }

  .sort-label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink3);
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }

  .sort-btn {
    background: none;
    border: 1.5px solid var(--faint);
    color: var(--ink3);
    font-size: 10px;
    font-family: var(--mono);
    padding: 3px 8px;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 0;
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .sort-btn:hover { border-color: var(--ink); color: var(--ink); }
  .sort-btn.active { background: var(--ink); color: var(--card); border-color: var(--ink); }

  /* ── Grid ── */
  .grid {
    padding: 14px 12px 100px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr 1fr; padding: 16px 16px 100px; } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    position: relative;
    animation: pop 0.18s ease both;
    transition: box-shadow 0.1s, transform 0.1s;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover { box-shadow: 6px 6px 0 var(--ink); transform: translate(-1px,-1px); }

  .card-stripe { height: 6px; width: 100%; }

  .card-body { padding: 12px 14px 14px; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-name {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.3px;
    font-family: Georgia, 'Times New Roman', serif;
    cursor: text;
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .card-name:hover { text-decoration: underline; text-decoration-style: dotted; }

  .card-edit-btn {
    background: none;
    border: 1.5px solid var(--faint);
    color: var(--ink3);
    font-size: 9px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 7px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 0;
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .card-edit-btn:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }

  .card-codeword {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1.5px solid currentColor;
    padding: 2px 6px;
    margin-bottom: 6px;
    cursor: text;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-codeword-empty {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink3);
    border: 1.5px dashed var(--faint);
    padding: 2px 6px;
    margin-bottom: 6px;
    cursor: text;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-expertise {
    font-size: 12px;
    color: var(--ink2);
    margin-bottom: 8px;
    cursor: text;
    line-height: 1.4;
  }

  .card-expertise-empty {
    font-size: 12px;
    color: var(--ink3);
    margin-bottom: 8px;
    cursor: text;
    font-style: italic;
  }

  .card-expertise:hover,
  .card-expertise-empty:hover { text-decoration: underline; text-decoration-style: dotted; }

  .card-context {
    font-size: 11px;
    color: var(--ink3);
    line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-style: italic;
    cursor: pointer;
  }

  .card-fact {
    font-size: 11px;
    color: var(--ink2);
    line-height: 1.4;
    margin-bottom: 8px;
    padding: 5px 8px;
    border-left: 3px solid var(--faint);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--faint);
    margin: 8px 0;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .card-date-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink3);
    cursor: pointer;
    flex: 1;
    min-width: 0;
  }

  .card-date-wrap:hover .date-label { text-decoration: underline; text-decoration-style: dotted; }

  .recency-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .date-label { white-space: nowrap; }

  .card-date-input {
    font-family: var(--mono);
    font-size: 11px;
    border: none;
    border-bottom: 2px solid var(--ink);
    background: none;
    outline: none;
    color: var(--ink);
    padding: 0;
    max-width: 130px;
    border-radius: 0;
    cursor: pointer;
    display: none;
  }

  .today-btn {
    background: none;
    border: 1.5px solid var(--faint);
    color: var(--ink3);
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 5px;
    cursor: pointer;
    border-radius: 0;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .today-btn:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }

  .stage-tag {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 2px 6px;
    border: 1.5px solid currentColor;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Inline edit inputs on card ── */
  .inline-input {
    background: #fffef9;
    border: none;
    border-bottom: 2px solid var(--ink);
    outline: none;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    color: var(--ink);
    padding: 1px 2px;
    width: 100%;
    border-radius: 0;
  }

  .inline-name { font-size: 17px; font-weight: 800; font-family: Georgia, serif; letter-spacing: -0.3px; }
  .inline-mono { font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .inline-small { font-size: 12px; }

  /* ── Empty / no results ── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 24px;
    border: 2px dashed var(--faint);
  }

  .empty-title { font-size: 20px; font-weight: 800; font-family: Georgia, serif; margin-bottom: 8px; }
  .empty-sub { font-size: 13px; color: var(--ink3); font-style: italic; }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: var(--ink3);
    border: 2px dashed var(--faint);
  }

  .no-results-title { font-size: 15px; font-weight: 700; font-family: Georgia, serif; margin-bottom: 6px; color: var(--ink); }
  .no-results-sub { font-size: 12px; font-style: italic; }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--ink);
    color: var(--card);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.25);
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 200;
    font-size: 28px;
    font-weight: 300;
    line-height: 1;
    transition: transform 0.1s, box-shadow 0.1s;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .fab:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.25); }
  .fab:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.25); }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  @media (min-width: 600px) {
    .modal-overlay { align-items: center; justify-content: center; }
  }

  /* ── Modal ── */
  .modal {
    background: var(--bg);
    border: 2px solid var(--ink);
    border-bottom: none;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  @media (min-width: 600px) {
    .modal {
      border: 2px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      max-width: 580px;
      max-height: 90dvh;
      transform: translateY(16px) scale(0.97);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  }

  .modal-handle {
    width: 32px;
    height: 3px;
    background: var(--faint);
    margin: 10px auto 0;
    border-radius: 2px;
  }

  @media (min-width: 600px) { .modal-handle { display: none; } }

  .modal-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 10px;
    border-bottom: 2px solid var(--ink);
  }

  .modal-title {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    font-family: var(--mono);
    letter-spacing: 1px;
  }

  .modal-close {
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    font-weight: 900;
    font-family: var(--mono);
    border-radius: 0;
    transition: all 0.1s;
  }

  .modal-close:hover { background: var(--ink); color: var(--card); }

  .modal-body { padding: 14px; }

  /* ── Form ── */
  .form-section { margin-bottom: 18px; }

  .form-section-title {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink3);
    margin-bottom: 10px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--faint);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-group { margin-bottom: 10px; }

  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink2);
    margin-bottom: 4px;
  }

  .form-input,
  .form-textarea,
  .form-select {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-size: 14px;
    padding: 8px 10px;
    outline: none;
    font-family: inherit;
    border-radius: 0;
    -webkit-appearance: none;
    transition: box-shadow 0.1s;
  }

  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus { box-shadow: 3px 3px 0 var(--ink); }

  .form-input::placeholder,
  .form-textarea::placeholder { color: var(--ink3); font-style: italic; }
  .form-textarea { resize: none; min-height: 72px; line-height: 1.5; }
  .form-textarea.short { min-height: 56px; }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--card); }

  /* ── Color swatches ── */
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .color-swatch {
    width: 26px;
    height: 26px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
    flex-shrink: 0;
  }

  .color-swatch.selected {
    border-color: var(--ink);
    transform: scale(1.2);
    outline: 2px solid var(--card);
    outline-offset: -3px;
  }

  /* ── Modal footer ── */
  .modal-footer {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 2px solid var(--ink);
    position: sticky;
    bottom: 0;
    background: var(--bg);
  }

  .btn {
    flex: 1;
    border: 2px solid var(--ink);
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 11px;
    cursor: pointer;
    border-radius: 0;
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: translate(2px,2px); }

  .btn-primary {
    background: var(--ink);
    color: var(--card);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
  }

  .btn-primary:hover { box-shadow: 4px 4px 0 rgba(0,0,0,0.25); transform: translate(-1px,-1px); }

  .btn-secondary { background: var(--card); color: var(--ink); }
  .btn-secondary:hover { background: var(--faint); }

  .btn-danger {
    background: none;
    border-color: var(--red);
    color: var(--red);
    flex: 0;
    padding: 11px 14px;
  }

  .btn-danger:hover { background: var(--red); color: var(--card); }

  /* ── Detail modal ── */
  .detail-hero {
    padding: 16px 14px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .detail-avatar {
    width: 54px;
    height: 54px;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    font-family: Georgia, serif;
    flex-shrink: 0;
    letter-spacing: -1px;
  }

  .detail-name {
    font-size: 22px;
    font-weight: 900;
    font-family: Georgia, serif;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    line-height: 1.1;
  }

  .detail-codeword {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1.5px solid currentColor;
    padding: 2px 6px;
    display: inline-block;
    margin-bottom: 4px;
  }

  .detail-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--faint);
  }

  .detail-section-title {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink3);
    margin-bottom: 6px;
  }

  .detail-text { font-size: 14px; color: var(--ink2); line-height: 1.6; }

  .detail-chips { display: flex; flex-wrap: wrap; gap: 5px; }

  .detail-chip {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border: 1.5px solid currentColor;
  }

  .fun-facts-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }

  .fun-facts-list li {
    font-size: 13px;
    color: var(--ink2);
    padding: 7px 10px;
    border-left: 3px solid var(--ink);
    background: var(--card);
    line-height: 1.5;
  }

  .contact-list { display: flex; flex-direction: column; gap: 7px; }

  .contact-item { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }

  .contact-label-tag {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink3);
    width: 64px;
    flex-shrink: 0;
  }

  .contact-val { color: var(--ink2); word-break: break-all; }
  .contact-val a { color: var(--ink); text-underline-offset: 3px; }

  /* ── Confirm ── */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .confirm-overlay.open { opacity: 1; pointer-events: all; }

  .confirm-box {
    background: var(--card);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 22px;
    width: 100%;
    max-width: 300px;
    transform: scale(0.92);
    transition: transform 0.15s;
    text-align: center;
  }

  .confirm-overlay.open .confirm-box { transform: scale(1); }
  .confirm-box h3 { font-family: Georgia, serif; font-size: 18px; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: var(--ink2); margin-bottom: 18px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions .btn { padding: 10px; }
  .confirm-actions .btn-danger { flex: 1; border-width: 2px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--card);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 16px;
    z-index: 1000;
    opacity: 0;
    transition: all 0.2s;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Highlight ── */
  mark { background: #ffe066; color: var(--ink); padding: 0 1px; border-radius: 0; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); }
</style>
</head>

<!-- FAB -->

<!-- ══ EDIT MODAL ══ -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">New Contact</div>

    <div class="modal-body">

      <div class="form-section">

          </div>

<!-- ══ DETAIL MODAL ══ -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-handle"></div>

      <div class="modal-title">Contact</div>
      <button class="modal-close" id="detailClose">x</button>

<!-- ══ CONFIRM ══ -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete?</h3>

    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel">Keep</button>
      <button class="btn btn-danger" id="confirmOk" style="flex:1;padding:10px 14px">Delete</button>
    </div>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────
const STORAGE_KEY = 'nw_contacts_v1';

const COLORS = [
  { bg: '#e63946' }, // red
  { bg: '#f4a261' }, // orange
  { bg: '#2a9d8f' }, // teal
  { bg: '#457b9d' }, // blue
  { bg: '#6d597a' }, // purple
  { bg: '#e9c46a' }, // yellow
  { bg: '#264653' }, // dark teal
  { bg: '#c77dff' }, // violet
  { bg: '#023e8a' }, // navy
  { bg: '#606c38' }, // olive
];

const STAGE_LABELS = {
  new:     { label: 'New',        color: '#457b9d' },
  warm:    { label: 'Warming up', color: '#f4a261' },
  active:  { label: 'Active',     color: '#2a9d8f' },
  dormant: { label: 'Gone quiet', color: '#888888' },
  close:   { label: 'Close ally', color: '#6d597a' },
};

// ─── State ────────────────────────────────────────────────────
let contacts = [];
let editingId = null;
let detailId = null;
let selectedColor = 0;
let activeFilter = 'all';
let activeSort = 'name';
let searchQuery = '';

// ─── Storage ──────────────────────────────────────────────────
function load() {
  try { contacts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { contacts = []; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
}

// ─── Helpers ──────────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function initials(name) {
  return (name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
}

function daysSince(dateStr) {
  if (!dateStr) return Infinity;
  return Math.floor((Date.now() - new Date(dateStr + 'T00:00:00').getTime()) / 86400000);
}

function friendlyDate(dateStr) {
  if (!dateStr) return 'never';
  const d = daysSince(dateStr);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7) return `${d}d ago`;
  if (d < 30) return `${Math.floor(d/7)}w ago`;
  if (d < 365) return `${Math.floor(d/30)}mo ago`;
  return `${Math.floor(d/365)}y ago`;
}

function recencyColor(dateStr) {
  const d = daysSince(dateStr);
  if (d < 14) return '#2a9d8f';
  if (d < 60) return '#f4a261';
  return '#bbbbbb';
}

function esc(str) {
  return (str || '').replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function highlight(text, query) {
  if (!query || !text) return esc(text || '');
  const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ─── Filter + Sort ────────────────────────────────────────────
function getFiltered() {
  let list = [...contacts];
  const q = searchQuery.toLowerCase().trim();

  if (q) {
    list = list.filter(c =>
      [c.name, c.codeword, c.expertise, c.context, c.funFacts, c.notes, c.email, c.stage]
        .some(f => (f || '').toLowerCase().includes(q))
    );
  }

  switch (activeFilter) {
    case 'recent':      list = list.filter(c => daysSince(c.lastSpoken) <= 14); break;
    case 'no-contact':  list = list.filter(c => daysSince(c.lastSpoken) > 60);  break;
    case 'expertise':   list = list.filter(c => (c.expertise || '').trim());    break;
    case 'no-codeword': list = list.filter(c => !(c.codeword || '').trim());    break;
  }

  switch (activeSort) {
    case 'name':      list.sort((a,b) => (a.name||'').localeCompare(b.name||'')); break;
    case 'name-desc': list.sort((a,b) => (b.name||'').localeCompare(a.name||'')); break;
    case 'recent':    list.sort((a,b) => daysSince(a.lastSpoken) - daysSince(b.lastSpoken)); break;
    case 'added':     list.sort((a,b) => (b.addedAt||0) - (a.addedAt||0)); break;
  }

  return list;
}

// ─── Render grid ──────────────────────────────────────────────
function renderGrid() {
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase().trim();

  document.getElementById('countBadge').textContent =
    contacts.length === 1 ? '1 contact' : `${contacts.length} contacts`;

  if (contacts.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-title">Your network starts here.</div>
        <div class="empty-sub">Hit the + button to add your first person.</div>
      </div>`;
    return;
  }

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <div class="no-results-title">Nothing found.</div>
        <div class="no-results-sub">Try different words or clear the filter.</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((c, i) => {
    const col = COLORS[c.colorIdx ?? 0];
    const stage = STAGE_LABELS[c.stage] || null;
    const funFacts = (c.funFacts || '').split('\n').filter(f => f.trim());
    const rColor = recencyColor(c.lastSpoken);
    const expertiseTags = (c.expertise || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 3);

    return `
      <div class="card" data-id="${c.id}" style="animation-delay:${Math.min(i*0.025,0.25)}s">
        <div class="card-stripe" style="background:${col.bg}"></div>
        <div class="card-body">
          <div class="card-top">
            <div class="card-name editable" data-field="name" data-id="${c.id}">${highlight(c.name, q)}</div>
            <button class="card-edit-btn" data-id="${c.id}">Edit</button>
          </div>

          <div class="${c.codeword ? 'card-codeword editable' : 'card-codeword-empty editable'}"
            data-field="codeword" data-id="${c.id}"
            ${c.codeword ? `style="color:${col.bg}"` : ''}>
            ${c.codeword ? highlight(c.codeword, q) : '+ codeword'}
          </div>

          <div class="${c.expertise ? 'card-expertise editable' : 'card-expertise-empty editable'}"
            data-field="expertise" data-id="${c.id}">
            ${c.expertise ? highlight(c.expertise, q) : '+ expertise / role'}
          </div>

          ${c.context ? `<div class="card-context open-detail" data-id="${c.id}">${highlight(c.context, q)}</div>` : ''}
          ${funFacts.length ? `<div class="card-fact open-detail" data-id="${c.id}">${esc(funFacts[0])}</div>` : ''}

          <hr class="card-divider" />

          <div class="card-footer">
            <div class="card-date-wrap" data-date-id="${c.id}">
              <div class="recency-dot" style="background:${rColor}"></div>
              <span class="date-label">${friendlyDate(c.lastSpoken)}</span>
              <input type="date" class="card-date-input" data-id="${c.id}" value="${c.lastSpoken || ''}" />
            </div>
            <button class="today-btn" data-id="${c.id}">Today</button>
            ${stage ? `<span class="stage-tag" style="color:${stage.color}">${stage.label}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  attachCardEvents(grid);
}

// ─── Card events (inline editing, date, detail) ───────────────
function attachCardEvents(grid) {
  // Open detail on card click (not on interactive children)
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.editable, .card-edit-btn, .card-date-wrap, .today-btn, .open-detail')) return;
      openDetail(card.dataset.id);
    });
  });

  // Context / fun fact → detail
  grid.querySelectorAll('.open-detail').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openDetail(el.dataset.id);
    });
  });

  // Edit button → full modal
  grid.querySelectorAll('.card-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEdit(btn.dataset.id);
    });
  });

  // Inline editable fields
  grid.querySelectorAll('.editable').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      startInlineEdit(el);
    });
  });

  // Date label click → reveal date input
  grid.querySelectorAll('[data-date-id]').forEach(wrap => {
    wrap.addEventListener('click', e => {
      e.stopPropagation();
      const input = wrap.querySelector('.card-date-input');
      const label = wrap.querySelector('.date-label');
      label.style.display = 'none';
      input.style.display = '';
      try { input.showPicker(); } catch(_) { input.focus(); }
    });
  });

  // Date input change → save
  grid.querySelectorAll('.card-date-input').forEach(input => {
    input.addEventListener('change', e => {
      e.stopPropagation();
      const c = contacts.find(x => x.id === input.dataset.id);
      if (c) { c.lastSpoken = input.value; save(); renderGrid(); toast('Saved'); }
    });
    input.addEventListener('blur', e => {
      e.stopPropagation();
      // If no change was made, just re-render to restore label
      renderGrid();
    });
  });

  // Today button
  grid.querySelectorAll('.today-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const c = contacts.find(x => x.id === btn.dataset.id);
      if (c) { c.lastSpoken = todayStr(); save(); renderGrid(); toast('Marked today'); }
    });
  });
}

// ─── Inline edit ──────────────────────────────────────────────
function startInlineEdit(el) {
  if (el.dataset.editing) return;
  el.dataset.editing = '1';

  const id = el.dataset.id;
  const field = el.dataset.field;
  const c = contacts.find(x => x.id === id);
  if (!c) { delete el.dataset.editing; return; }

  const originalVal = c[field] || '';
  const originalHTML = el.innerHTML;

  const isName = field === 'name';
  const isMono = field === 'codeword';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = originalVal;
  input.className = 'inline-input' + (isName ? ' inline-name' : isMono ? ' inline-mono' : ' inline-small');
  if (field === 'name') input.maxLength = 80;
  if (field === 'codeword') input.maxLength = 40;
  if (field === 'expertise') input.maxLength = 100;

  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  let committed = false;

  function commit() {
    if (committed) return;
    committed = true;
    const val = input.value.trim();
    if (field === 'name' && !val) {
      el.innerHTML = originalHTML;
      delete el.dataset.editing;
      return;
    }
    if (val !== originalVal) {
      c[field] = val;
      save();
      toast('Saved');
    }
    delete el.dataset.editing;
    renderGrid();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') {
      committed = true;
      el.innerHTML = originalHTML;
      delete el.dataset.editing;
    }
  });
}

// ─── Color row ────────────────────────────────────────────────
function buildColorRow() {
  const row = document.getElementById('colorRow');
  row.innerHTML = COLORS.map((c, i) => `
    <div class="color-swatch${i === selectedColor ? ' selected' : ''}" data-idx="${i}" style="background:${c.bg}"></div>
  `).join('');
  row.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => { selectedColor = +sw.dataset.idx; buildColorRow(); });
  });
}

// ─── Edit modal ───────────────────────────────────────────────
function openEdit(id) {
  editingId = id || null;
  const c = id ? contacts.find(x => x.id === id) : null;

  document.getElementById('editModalTitle').textContent = c ? 'Edit Contact' : 'New Contact';
  document.getElementById('deleteBtn').style.display = c ? '' : 'none';

  selectedColor = c?.colorIdx ?? 0;
  buildColorRow();

  const fields = ['name','codeword','expertise','context','lastSpoken','stage',
    'painPoints','goals','funFacts','email','phone','linkedin','twitter','instagram','website','notes'];
  fields.forEach(f => {
    const el = document.getElementById('f-' + f);
    if (el) el.value = c ? (c[f] || '') : '';
  });

  if (!c) document.getElementById('f-lastSpoken').value = todayStr();

  closeDetail();
  document.getElementById('editOverlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 320);
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  editingId = null;
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) {
    const el = document.getElementById('f-name');
    el.focus();
    el.style.outline = '2px solid var(--red)';
    setTimeout(() => el.style.outline = '', 1500);
    toast('Name is required');
    return;
  }

  const fields = ['name','codeword','expertise','context','lastSpoken','stage',
    'painPoints','goals','funFacts','email','phone','linkedin','twitter','instagram','website','notes'];
  const data = {};
  fields.forEach(f => { data[f] = document.getElementById('f-' + f).value.trim(); });
  data.colorIdx = selectedColor;

  if (editingId) {
    const idx = contacts.findIndex(c => c.id === editingId);
    contacts[idx] = { ...contacts[idx], ...data };
    toast('Contact updated');
  } else {
    contacts.push({ id: uid(), addedAt: Date.now(), ...data });
    toast('Contact added');
  }

  save();
  closeEdit();
  renderGrid();
});

document.getElementById('cancelBtn').addEventListener('click', closeEdit);
document.getElementById('editClose').addEventListener('click', closeEdit);
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('editOverlay')) closeEdit();
});

// ─── Delete ───────────────────────────────────────────────────
document.getElementById('deleteBtn').addEventListener('click', () => {
  const c = contacts.find(x => x.id === editingId);
  document.getElementById('confirmText').textContent = `"${c?.name}" will be permanently removed.`;
  document.getElementById('confirmOverlay').classList.add('open');
});

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmOverlay').classList.remove('open');
});

document.getElementById('confirmOk').addEventListener('click', () => {
  contacts = contacts.filter(c => c.id !== editingId);
  save();
  document.getElementById('confirmOverlay').classList.remove('open');
  closeEdit();
  renderGrid();
  toast('Deleted');
});

// ─── Detail modal ─────────────────────────────────────────────
function openDetail(id) {
  detailId = id;
  const c = contacts.find(x => x.id === id);
  if (!c) return;

  const col = COLORS[c.colorIdx ?? 0];
  const stage = STAGE_LABELS[c.stage] || null;
  const funFacts = (c.funFacts || '').split('\n').filter(f => f.trim());
  const expertiseTags = (c.expertise || '').split(',').map(s => s.trim()).filter(Boolean);

  const contactItems = [
    { label: 'Email',     val: c.email,     href: c.email    ? `mailto:${c.email}` : null },
    { label: 'Phone',     val: c.phone,     href: c.phone    ? `tel:${c.phone}`    : null },
    { label: 'LinkedIn',  val: c.linkedin  },
    { label: 'X/Twitter', val: c.twitter   },
    { label: 'Instagram', val: c.instagram },

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-hero" style="border-left:6px solid ${col.bg}">
      <div class="detail-avatar" style="background:${col.bg}22;color:${col.bg}">${initials(c.name)}</div>

        ${stage ? `<div class="stage-tag" style="color:${stage.color};display:inline-block;margin-top:6px">${stage.label}</div>` : ''}

    ${c.context ? `

    <div class="detail-section">

        <div style="width:8px;height:8px;border-radius:50%;background:${recencyColor(c.lastSpoken)};flex-shrink:0"></div>
        ${friendlyDate(c.lastSpoken)}
        ${c.lastSpoken ? `<span style="color:var(--ink3);font-size:12px;font-family:var(--mono)">${c.lastSpoken}</span>` : ''}
      </div>
    </div>

    ${c.painPoints ? `
    <div class="detail-section">
      <div class="detail-section-title">Pain Points</div>
      <div class="detail-text">${esc(c.painPoints)}</div>
    </div>` : ''}

    ${c.goals ? `
    <div class="detail-section">
      <div class="detail-section-title">Goals and Ambitions</div>
      <div class="detail-text">${esc(c.goals)}</div>
    </div>` : ''}

    ${expertiseTags.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Expertise</div>
      <div class="detail-chips">
        ${expertiseTags.map(t => `<span class="detail-chip" style="color:${col.bg}">${esc(t)}</span>`).join('')}
      </div>
    </div>` : ''}

    ${funFacts.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Fun Facts and Conversation Anchors</div>
      <ul class="fun-facts-list">
        ${funFacts.map(f => `<li>${esc(f)}</li>`).join('')}
      </ul>
    </div>` : ''}

    ${contactItems.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Contact and Socials</div>
      <div class="contact-list">
        ${contactItems.map(item => `
          <div class="contact-item">
            <span class="contact-label-tag">${item.label}</span>
            <span class="contact-val">
              ${item.href
                ? `<a href="${esc(item.href)}">${esc(item.val)}</a>`
                : esc(item.val)}
            </span>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${c.notes ? `
    <div class="detail-section">
      <div class="detail-section-title">Notes</div>
      <div class="detail-text">${esc(c.notes)}</div>
    </div>` : ''}
  `;

  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  detailId = null;
}

document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
});
document.getElementById('detailEditBtn').addEventListener('click', () => {
  const id = detailId;
  closeDetail();
  openEdit(id);
});

// ─── FAB ──────────────────────────────────────────────────────
document.getElementById('fabBtn').addEventListener('click', () => openEdit(null));

// ─── Search ───────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchClear.classList.toggle('visible', searchQuery.length > 0);
  renderGrid();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  renderGrid();
  searchInput.focus();
});

// ─── Filters ──────────────────────────────────────────────────
document.getElementById('filtersWrap').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  renderGrid();
});

// ─── Sort ─────────────────────────────────────────────────────
document.querySelector('.sort-bar').addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeSort = btn.dataset.sort;
  renderGrid();
});

// ─── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) {
      document.getElementById('confirmOverlay').classList.remove('open');
    } else if (document.getElementById('editOverlay').classList.contains('open')) {
      closeEdit();
    } else if (document.getElementById('detailOverlay').classList.contains('open')) {
      closeDetail();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    openEdit(null);
  }
});
