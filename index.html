<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Network</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --accent-dim: rgba(124,106,247,0.15);
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #606078;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --pink: #f472b6;
    --cyan: #22d3ee;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,15,19,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    flex: 1;
  }

  .count-badge {
    background: var(--accent-dim);
    color: var(--accent2);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid rgba(124,106,247,0.3);
  }

  /* ── Search ── */
  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    width: 16px;
    height: 16px;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 36px 10px 36px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--surface2);
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 12px;
    display: none;
  }

  .search-clear.visible { display: flex; }

  /* ── Filter chips ── */
  .filters-wrap {
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    display: flex;
    gap: 6px;
    padding-bottom: 12px;
    white-space: nowrap;
  }

  .filters-wrap::-webkit-scrollbar { display: none; }

  .filter-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .filter-chip:active { transform: scale(0.95); }

  .filter-chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* ── Sort bar ── */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sort-bar::-webkit-scrollbar { display: none; }

  .sort-label { font-size: 12px; color: var(--text3); flex-shrink: 0; }

  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .sort-btn.active {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* ── Grid ── */
  .grid {
    padding: 12px 12px 100px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  @media (min-width: 480px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  @media (min-width: 768px) {
    .grid { grid-template-columns: 1fr 1fr 1fr; padding: 16px 16px 100px; gap: 12px; }
  }

  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    animation: fadeIn 0.25s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card:active { transform: scale(0.98); }
  .card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }

  .card-accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: -1px;
  }

  .card-name-wrap { flex: 1; min-width: 0; }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-codeword {
    font-size: 11px;
    color: var(--accent2);
    background: var(--accent-dim);
    border-radius: 6px;
    padding: 2px 6px;
    display: inline-block;
    font-weight: 500;
    margin-bottom: 4px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-meta {
    font-size: 11px;
    color: var(--text3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-section {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .last-spoken {
    font-size: 11px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .last-spoken-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text3);
    grid-column: 1 / -1;
  }

  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
  .empty-sub { font-size: 14px; line-height: 1.6; }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(124,106,247,0.5);
    z-index: 200;
    transition: transform 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .fab:active { transform: scale(0.92); }
  .fab:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(124,106,247,0.65); }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  @media (min-width: 600px) {
    .modal-overlay { align-items: center; justify-content: center; }
  }

  /* ── Modal ── */
  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  @media (min-width: 600px) {
    .modal {
      border-radius: var(--radius);
      max-width: 640px;
      max-height: 90dvh;
      transform: scale(0.95) translateY(10px);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  @media (min-width: 600px) { .modal-handle { display: none; } }

  .modal-header {
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
  }

  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .modal-body { padding: 16px; }

  /* ── Form ── */
  .form-section {
    margin-bottom: 20px;
  }

  .form-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .form-group {
    margin-bottom: 10px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 5px;
  }

  .form-input,
  .form-textarea,
  .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }

  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus { border-color: var(--accent); }

  .form-input::placeholder,
  .form-textarea::placeholder { color: var(--text3); }

  .form-textarea {
    resize: none;
    min-height: 80px;
    line-height: 1.5;
  }

  .form-textarea.short { min-height: 60px; }

  .form-select { cursor: pointer; }

  .form-select option { background: var(--surface2); }

  /* Color picker for avatar */
  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .color-swatch.selected { border-color: #fff; transform: scale(1.15); }

  /* ── Modal footer ── */
  .modal-footer {
    display: flex;
    gap: 10px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    position: sticky;
    bottom: 0;
    background: var(--surface);
  }

  .btn {
    flex: 1;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    padding: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 2px 12px rgba(124,106,247,0.35);
  }

  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
  }

  .btn-danger {
    background: rgba(248,113,113,0.15);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--red);
    flex: 0;
    padding: 13px 16px;
  }

  /* ── Detail view ── */
  .detail-hero {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-avatar {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .detail-name {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .detail-codeword {
    font-size: 12px;
    color: var(--accent2);
    background: var(--accent-dim);
    border-radius: 8px;
    padding: 3px 8px;
    display: inline-block;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .detail-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .detail-text {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }

  .detail-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .detail-chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 500;
  }

  .detail-contacts {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text);
  }

  .contact-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .contact-label { color: var(--text3); font-size: 11px; }

  .fun-facts-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fun-facts-list li {
    font-size: 13px;
    color: var(--text2);
    padding: 8px 12px;
    background: var(--bg);
    border-radius: 8px;
    border-left: 3px solid var(--amber);
    line-height: 1.5;
  }

  /* ── No results ── */
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }

  /* ── Confirm dialog ── */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .confirm-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 320px;
    transform: scale(0.9);
    transition: transform 0.2s;
    text-align: center;
  }

  .confirm-overlay.open .confirm-box { transform: scale(1); }
  .confirm-box h3 { margin-bottom: 8px; font-size: 17px; }
  .confirm-box p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }

  .confirm-actions { display: flex; gap: 10px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Highlight match ── */
  mark {
    background: rgba(124,106,247,0.3);
    color: var(--accent2);
    border-radius: 3px;
    padding: 0 1px;
  }

  /* Toasts */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    z-index: 1000;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="logo">Network</div>
    <span class="count-badge" id="countBadge">0 contacts</span>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
    </svg>
    <input class="search-input" id="searchInput" type="search" placeholder="Search name, codeword, expertise, context…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <button class="search-clear" id="searchClear" title="Clear">✕</button>
  </div>

  <div class="filters-wrap" id="filtersWrap">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="recent">Recently spoken</button>
    <button class="filter-chip" data-filter="no-contact">Haven't touched base</button>
    <button class="filter-chip" data-filter="expertise">By expertise</button>
    <button class="filter-chip" data-filter="no-codeword">Missing codeword</button>
  </div>
</div>

<!-- Sort bar -->
<div class="sort-bar">
  <span class="sort-label">Sort:</span>
  <button class="sort-btn active" data-sort="name">Name A–Z</button>
  <button class="sort-btn" data-sort="name-desc">Name Z–A</button>
  <button class="sort-btn" data-sort="recent">Last spoken</button>
  <button class="sort-btn" data-sort="added">Date added</button>
</div>

<!-- Card Grid -->
<div class="grid" id="grid"></div>

<!-- FAB -->
<button class="fab" id="fabBtn" title="Add contact">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ══════════ EDIT / ADD MODAL ══════════ -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal" id="editModal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">Add Contact</div>
      <button class="modal-close" id="editClose">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">

      <!-- Identity -->
      <div class="form-section">
        <div class="form-section-title">Identity</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input class="form-input" id="f-name" type="text" placeholder="Jane Smith" maxlength="80" />
          </div>
          <div class="form-group">
            <label class="form-label">Codeword 🔑</label>
            <input class="form-input" id="f-codeword" type="text" placeholder="e.g. Startup Jane" maxlength="40" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Avatar Color</label>
          <div class="color-row" id="colorRow"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Expertise / Role</label>
          <input class="form-input" id="f-expertise" type="text" placeholder="e.g. Product Design, Growth, DevRel" maxlength="100" />
        </div>
      </div>

      <!-- How you met -->
      <div class="form-section">
        <div class="form-section-title">How You Met</div>
        <div class="form-group">
          <label class="form-label">Context</label>
          <textarea class="form-textarea short" id="f-context" placeholder="e.g. Met at ProductConf NYC 2024, sat next to each other at lunch…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Last Spoken</label>
            <input class="form-input" id="f-lastSpoken" type="date" />
          </div>
          <div class="form-group">
            <label class="form-label">Relationship Stage</label>
            <select class="form-select" id="f-stage">
              <option value="">— pick one —</option>
              <option value="new">New connection</option>
              <option value="warm">Warming up</option>
              <option value="active">Actively in touch</option>
              <option value="dormant">Gone quiet</option>
              <option value="close">Close ally</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Pain & Goals -->
      <div class="form-section">
        <div class="form-section-title">Their World</div>
        <div class="form-group">
          <label class="form-label">Pain Points</label>
          <textarea class="form-textarea short" id="f-painPoints" placeholder="What keeps them up at night? What challenges are they facing?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Goals &amp; Ambitions</label>
          <textarea class="form-textarea short" id="f-goals" placeholder="What are they working toward? What do they want to achieve?"></textarea>
        </div>
      </div>

      <!-- Fun Facts -->
      <div class="form-section">
        <div class="form-section-title">Fun Facts &amp; Anchors</div>
        <div class="form-group">
          <label class="form-label">Fun Facts (one per line)</label>
          <textarea class="form-textarea" id="f-funFacts" placeholder="Loves surfing&#10;Has 3 rescue cats&#10;Went to Burning Man 5 times&#10;Makes their own hot sauce"></textarea>
        </div>
      </div>

      <!-- Contacts -->
      <div class="form-section">
        <div class="form-section-title">Contact &amp; Socials</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">📧 Email</label>
            <input class="form-input" id="f-email" type="email" placeholder="jane@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label">📱 Phone</label>
            <input class="form-input" id="f-phone" type="tel" placeholder="+1 555 0100" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">💼 LinkedIn</label>
            <input class="form-input" id="f-linkedin" type="text" placeholder="linkedin.com/in/…" />
          </div>
          <div class="form-group">
            <label class="form-label">𝕏 X / Twitter</label>
            <input class="form-input" id="f-twitter" type="text" placeholder="@handle" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">📸 Instagram</label>
            <input class="form-input" id="f-instagram" type="text" placeholder="@handle" />
          </div>
          <div class="form-group">
            <label class="form-label">🌐 Website</label>
            <input class="form-input" id="f-website" type="text" placeholder="https://…" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">📝 Notes</label>
          <textarea class="form-textarea short" id="f-notes" placeholder="Anything else worth remembering…"></textarea>
        </div>
      </div>

    </div><!-- /modal-body -->

    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Contact</button>
    </div>
  </div>
</div>

<!-- ══════════ DETAIL MODAL ══════════ -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal" id="detailModal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Contact</div>
      <button class="modal-close" id="detailClose">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
        </svg>
      </button>
    </div>
    <div id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="detailEditBtn">Edit Contact</button>
    </div>
  </div>
</div>

<!-- ══════════ CONFIRM DIALOG ══════════ -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete contact?</h3>
    <p id="confirmText">This will permanently remove this contact.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel">Keep</button>
      <button class="btn" id="confirmOk" style="background:var(--red);color:#fff;flex:1">Delete</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────
const STORAGE_KEY = 'nw_contacts_v1';
const COLORS = [
  { bg: '#7c6af7', text: '#fff' },
  { bg: '#a78bfa', text: '#fff' },
  { bg: '#f472b6', text: '#fff' },
  { bg: '#22d3ee', text: '#0f0f13' },
  { bg: '#34d399', text: '#0f0f13' },
  { bg: '#fbbf24', text: '#0f0f13' },
  { bg: '#f87171', text: '#fff' },
  { bg: '#60a5fa', text: '#fff' },
  { bg: '#fb923c', text: '#fff' },
  { bg: '#a3e635', text: '#0f0f13' },
];

const STAGE_LABELS = {
  new: { label: 'New', color: '#60a5fa' },
  warm: { label: 'Warming up', color: '#fbbf24' },
  active: { label: 'Active', color: '#34d399' },
  dormant: { label: 'Gone quiet', color: '#f87171' },
  close: { label: 'Close ally', color: '#a78bfa' },
};

// ── State ──────────────────────────────────────────────────────
let contacts = [];
let editingId = null;
let detailId = null;
let selectedColor = 0;
let activeFilter = 'all';
let activeSort = 'name';
let searchQuery = '';

// ── Storage ────────────────────────────────────────────────────
function load() {
  try { contacts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { contacts = []; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
}

// ── Helpers ────────────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
}

function daysSince(dateStr) {
  if (!dateStr) return Infinity;
  const d = new Date(dateStr + 'T00:00:00');
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function friendlyDate(dateStr) {
  if (!dateStr) return 'Never';
  const d = daysSince(dateStr);
  if (d === 0) return 'Today';
  if (d === 1) return 'Yesterday';
  if (d < 7) return `${d} days ago`;
  if (d < 30) return `${Math.floor(d/7)}w ago`;
  if (d < 365) return `${Math.floor(d/30)}mo ago`;
  return `${Math.floor(d/365)}y ago`;
}

function recencyColor(dateStr) {
  const d = daysSince(dateStr);
  if (d < 14) return '#34d399';
  if (d < 60) return '#fbbf24';
  return '#f87171';
}

function esc(str) {
  return (str || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function highlight(text, query) {
  if (!query || !text) return esc(text || '');
  const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Filter & Sort ──────────────────────────────────────────────
function getFiltered() {
  let list = [...contacts];
  const q = searchQuery.toLowerCase().trim();

  if (q) {
    list = list.filter(c => {
      return [c.name, c.codeword, c.expertise, c.context, c.funFacts, c.notes, c.email, c.stage]
        .some(f => (f || '').toLowerCase().includes(q));
    });
  }

  switch (activeFilter) {
    case 'recent':
      list = list.filter(c => daysSince(c.lastSpoken) <= 14); break;
    case 'no-contact':
      list = list.filter(c => daysSince(c.lastSpoken) > 60); break;
    case 'expertise':
      list = list.filter(c => c.expertise && c.expertise.trim()); break;
    case 'no-codeword':
      list = list.filter(c => !c.codeword || !c.codeword.trim()); break;
  }

  switch (activeSort) {
    case 'name':
      list.sort((a,b) => (a.name||'').localeCompare(b.name||'')); break;
    case 'name-desc':
      list.sort((a,b) => (b.name||'').localeCompare(a.name||'')); break;
    case 'recent':
      list.sort((a,b) => {
        const da = daysSince(a.lastSpoken), db = daysSince(b.lastSpoken);
        return da - db;
      }); break;
    case 'added':
      list.sort((a,b) => (b.addedAt||0) - (a.addedAt||0)); break;
  }

  return list;
}

// ── Render grid ────────────────────────────────────────────────
function renderGrid() {
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase().trim();

  // Count badge
  const badge = document.getElementById('countBadge');
  badge.textContent = contacts.length === 1 ? '1 contact' : `${contacts.length} contacts`;

  if (contacts.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🌐</div>
        <div class="empty-title">Your network starts here</div>
        <div class="empty-sub">Tap the + button to add your first contact<br/>and start building your memory layer.</div>
      </div>`;
    return;
  }

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <div style="font-size:36px;margin-bottom:12px">🔍</div>
        <div style="font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px">No matches found</div>
        <div style="font-size:13px">Try a different search or filter</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((c, i) => {
    const col = COLORS[c.colorIdx ?? 0];
    const stage = STAGE_LABELS[c.stage] || null;
    const funFacts = (c.funFacts || '').split('\n').filter(f => f.trim());
    const rColor = recencyColor(c.lastSpoken);
    const expertiseTags = (c.expertise || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 3);

    return `
      <div class="card" data-id="${c.id}" style="animation-delay:${i * 0.03}s">
        <div class="card-accent-bar" style="background:linear-gradient(90deg,${col.bg},${col.bg}88)"></div>
        <div class="card-header">
          <div class="avatar" style="background:${col.bg}20;color:${col.bg};border:1.5px solid ${col.bg}44">
            ${initials(c.name)}
          </div>
          <div class="card-name-wrap">
            <div class="card-name">${highlight(c.name, q)}</div>
            ${c.codeword ? `<div class="card-codeword" title="Codeword">${highlight(c.codeword, q)}</div>` : ''}
            ${c.expertise ? `<div class="card-meta">${highlight(c.expertise, q)}</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="icon-btn edit-btn" data-id="${c.id}" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>
        </div>

        ${c.context ? `<div class="card-section" style="color:var(--text3);font-size:11px;font-style:italic;margin-bottom:6px">📍 ${highlight(c.context, q)}</div>` : ''}

        ${expertiseTags.length ? `
          <div class="card-tags">
            ${expertiseTags.map(t => `<span class="tag" style="background:${col.bg}18;color:${col.bg}">${highlight(t, q)}</span>`).join('')}
          </div>` : ''}

        ${funFacts.length ? `<div class="card-section" style="color:var(--text3);font-size:11px">⚡ ${esc(funFacts[0])}</div>` : ''}

        <div class="card-footer">
          <div class="last-spoken">
            <div class="last-spoken-dot" style="background:${rColor}"></div>
            ${friendlyDate(c.lastSpoken)}
          </div>
          ${stage ? `<span class="tag" style="background:${stage.color}20;color:${stage.color}">${stage.label}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  // Click listeners
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.edit-btn')) {
        openEdit(e.target.closest('.edit-btn').dataset.id);
      } else {
        openDetail(card.dataset.id);
      }
    });
  });
}

// ── Color row ──────────────────────────────────────────────────
function buildColorRow() {
  const row = document.getElementById('colorRow');
  row.innerHTML = COLORS.map((c, i) => `
    <div class="color-swatch${i === selectedColor ? ' selected' : ''}"
      data-idx="${i}" style="background:${c.bg}" title="${c.bg}"></div>
  `).join('');
  row.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      selectedColor = +sw.dataset.idx;
      buildColorRow();
    });
  });
}

// ── Edit modal ─────────────────────────────────────────────────
function openEdit(id) {
  editingId = id || null;
  const c = id ? contacts.find(x => x.id === id) : null;

  document.getElementById('editModalTitle').textContent = c ? 'Edit Contact' : 'Add Contact';
  document.getElementById('deleteBtn').style.display = c ? '' : 'none';

  selectedColor = c?.colorIdx ?? 0;
  buildColorRow();

  const fields = ['name','codeword','expertise','context','lastSpoken','stage',
    'painPoints','goals','funFacts','email','phone','linkedin','twitter','instagram','website','notes'];
  fields.forEach(f => {
    const el = document.getElementById('f-' + f);
    if (el) el.value = c ? (c[f] || '') : '';
  });

  if (!c) {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('f-lastSpoken').value = today;
  }

  closeDetail();
  document.getElementById('editOverlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 350);
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  editingId = null;
}

// Save
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) {
    document.getElementById('f-name').focus();
    document.getElementById('f-name').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('f-name').style.borderColor = '', 1500);
    toast('Name is required');
    return;
  }

  const fields = ['name','codeword','expertise','context','lastSpoken','stage',
    'painPoints','goals','funFacts','email','phone','linkedin','twitter','instagram','website','notes'];
  const data = {};
  fields.forEach(f => { data[f] = document.getElementById('f-' + f).value.trim(); });
  data.colorIdx = selectedColor;

  if (editingId) {
    const idx = contacts.findIndex(c => c.id === editingId);
    contacts[idx] = { ...contacts[idx], ...data };
    toast('Contact updated');
  } else {
    contacts.push({ id: uid(), addedAt: Date.now(), ...data });
    toast('Contact added');
  }

  save();
  closeEdit();
  renderGrid();
});

document.getElementById('cancelBtn').addEventListener('click', closeEdit);
document.getElementById('editClose').addEventListener('click', closeEdit);
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('editOverlay')) closeEdit();
});

// ── Delete ─────────────────────────────────────────────────────
document.getElementById('deleteBtn').addEventListener('click', () => {
  const c = contacts.find(x => x.id === editingId);
  document.getElementById('confirmText').textContent = `"${c?.name}" will be permanently removed.`;
  document.getElementById('confirmOverlay').classList.add('open');
});

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmOverlay').classList.remove('open');
});

document.getElementById('confirmOk').addEventListener('click', () => {
  contacts = contacts.filter(c => c.id !== editingId);
  save();
  document.getElementById('confirmOverlay').classList.remove('open');
  closeEdit();
  renderGrid();
  toast('Contact deleted');
});

// ── Detail modal ───────────────────────────────────────────────
function openDetail(id) {
  detailId = id;
  const c = contacts.find(x => x.id === id);
  if (!c) return;

  const col = COLORS[c.colorIdx ?? 0];
  const stage = STAGE_LABELS[c.stage] || null;
  const funFacts = (c.funFacts || '').split('\n').filter(f => f.trim());
  const expertiseTags = (c.expertise || '').split(',').map(s => s.trim()).filter(Boolean);

  const contactItems = [
    { icon: '📧', label: 'Email', val: c.email, href: c.email ? `mailto:${c.email}` : null },
    { icon: '📱', label: 'Phone', val: c.phone, href: c.phone ? `tel:${c.phone}` : null },
    { icon: '💼', label: 'LinkedIn', val: c.linkedin },
    { icon: '𝕏', label: 'X / Twitter', val: c.twitter },
    { icon: '📸', label: 'Instagram', val: c.instagram },
    { icon: '🌐', label: 'Website', val: c.website },
  ].filter(x => x.val);

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-hero" style="background:linear-gradient(135deg,${col.bg}15,transparent)">
      <div class="detail-avatar" style="background:${col.bg}25;color:${col.bg};border:2px solid ${col.bg}44">
        ${initials(c.name)}
      </div>
      <div>
        <div class="detail-name">${esc(c.name)}</div>
        ${c.codeword ? `<div class="detail-codeword">🔑 ${esc(c.codeword)}</div>` : ''}
        ${c.expertise ? `<div style="font-size:13px;color:var(--text2);margin-top:2px">${esc(c.expertise)}</div>` : ''}
        ${stage ? `<span class="tag" style="background:${stage.color}20;color:${stage.color};margin-top:4px;display:inline-block">${stage.label}</span>` : ''}
      </div>
    </div>

    ${c.context ? `
    <div class="detail-section">
      <div class="detail-section-title">📍 How You Met</div>
      <div class="detail-text">${esc(c.context)}</div>
    </div>` : ''}

    <div class="detail-section">
      <div class="detail-section-title">📅 Last Spoken</div>
      <div class="detail-text" style="display:flex;align-items:center;gap:8px">
        <span style="width:8px;height:8px;border-radius:50%;background:${recencyColor(c.lastSpoken)};display:inline-block;flex-shrink:0"></span>
        ${friendlyDate(c.lastSpoken)}
        ${c.lastSpoken ? `<span style="color:var(--text3);font-size:12px">(${c.lastSpoken})</span>` : ''}
      </div>
    </div>

    ${c.painPoints ? `
    <div class="detail-section">
      <div class="detail-section-title">⚠️ Pain Points</div>
      <div class="detail-text">${esc(c.painPoints)}</div>
    </div>` : ''}

    ${c.goals ? `
    <div class="detail-section">
      <div class="detail-section-title">🎯 Goals &amp; Ambitions</div>
      <div class="detail-text">${esc(c.goals)}</div>
    </div>` : ''}

    ${expertiseTags.length ? `
    <div class="detail-section">
      <div class="detail-section-title">🧠 Expertise</div>
      <div class="detail-chips">
        ${expertiseTags.map(t => `<span class="detail-chip" style="background:${col.bg}18;color:${col.bg};border:1px solid ${col.bg}33">${esc(t)}</span>`).join('')}
      </div>
    </div>` : ''}

    ${funFacts.length ? `
    <div class="detail-section">
      <div class="detail-section-title">⚡ Fun Facts &amp; Conversation Anchors</div>
      <ul class="fun-facts-list">
        ${funFacts.map(f => `<li>${esc(f)}</li>`).join('')}
      </ul>
    </div>` : ''}

    ${contactItems.length ? `
    <div class="detail-section">
      <div class="detail-section-title">💬 Contact &amp; Socials</div>
      <div class="detail-contacts">
        ${contactItems.map(item => `
          <div class="contact-row">
            <div class="contact-icon" style="background:var(--surface2)">${item.icon}</div>
            <div>
              <div class="contact-label">${item.label}</div>
              ${item.href
                ? `<a href="${esc(item.href)}" style="color:var(--accent2);text-decoration:none;font-size:14px">${esc(item.val)}</a>`
                : `<div style="font-size:14px">${esc(item.val)}</div>`
              }
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${c.notes ? `
    <div class="detail-section">
      <div class="detail-section-title">📝 Notes</div>
      <div class="detail-text">${esc(c.notes)}</div>
    </div>` : ''}
  `;

  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  detailId = null;
}

document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
});
document.getElementById('detailEditBtn').addEventListener('click', () => {
  const id = detailId;
  closeDetail();
  openEdit(id);
});

// ── FAB ────────────────────────────────────────────────────────
document.getElementById('fabBtn').addEventListener('click', () => openEdit(null));

// ── Search ────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchClear.classList.toggle('visible', searchQuery.length > 0);
  renderGrid();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  renderGrid();
  searchInput.focus();
});

// ── Filters ────────────────────────────────────────────────────
document.getElementById('filtersWrap').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  renderGrid();
});

// ── Sort ───────────────────────────────────────────────────────
document.querySelector('.sort-bar').addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeSort = btn.dataset.sort;
  renderGrid();
});

// ── Keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) {
      document.getElementById('confirmOverlay').classList.remove('open');
    } else if (document.getElementById('editOverlay').classList.contains('open')) {
      closeEdit();
    } else if (document.getElementById('detailOverlay').classList.contains('open')) {
      closeDetail();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    openEdit(null);
  }
});
